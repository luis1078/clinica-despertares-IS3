name: QA - Ejecucion de pruebas (Avance 3)

# Ejecuta la suite completa de pruebas del informe final de calidad y guarda
# los resultados (JUnit XML, cobertura JaCoCo y rendimiento) en la carpeta
# resultados-qa/ de esta misma rama.
on:
  push:
    branches: [ pruebas-is3 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - name: Compilar y ejecutar pruebas (sin detenerse en fallos)
        run: ./mvnw -B verify -Dmaven.test.failure.ignore=true 2>&1 | tee build.log
      - name: Publicar resultados en la rama
        if: always()
        run: |
          rm -rf resultados-qa && mkdir -p resultados-qa/surefire
          cp target/surefire-reports/*.xml resultados-qa/surefire/ 2>/dev/null || true
          cp target/surefire-reports/*.txt resultados-qa/surefire/ 2>/dev/null || true
          cp target/site/jacoco/jacoco.csv resultados-qa/ 2>/dev/null || true
          cp target/qa/rendimiento.csv resultados-qa/ 2>/dev/null || true
          grep -E "Tests run:|ERROR|BUILD|\[QA" build.log > resultados-qa/resumen.log || true
          tail -c 200000 build.log > resultados-qa/build-tail.log
          echo "run=${GITHUB_RUN_ID} sha=${GITHUB_SHA} fecha=$(date -u +%FT%TZ)" > resultados-qa/ejecucion.txt
          git config user.name "qa-bot"
          git config user.email "qa-bot@users.noreply.github.com"
          git add -f resultados-qa
          git commit -m "Resultados de ejecución de pruebas QA [skip ci]" || exit 0
          git push
