# Base de datos
# Los valores por defecto son solo para desarrollo local; en cualquier otro entorno
# se deben definir las variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?stringtype=unspecified}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
# En false (valor por defecto local) cada request reparsea las plantillas desde
# cero, útil para ver cambios sin reiniciar durante desarrollo. En Docker/producción
# se activa (THYMELEAF_CACHE=true en docker-compose.yml): sin esto, cada navegación
# entre secciones se siente con una carga perceptible aunque no cambie nada en la BD.
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Datos de ejemplo (médicos, proveedores, pacientes, medicamentos) al arrancar
# con la base vacía. Ver Config/DataSeeder.java. SEED_DATA=false lo desactiva.
app.seed-data=${SEED_DATA:true}

# Sesión solo por cookie, nunca por URL (;jsessionid=... en cada enlace). Sin
# esto, la primerísima respuesta a un visitante nuevo (antes de que confirme
# soporte de cookies) mete el id de sesión en cada @{...} de la plantilla,
# incluidos los recursos estáticos versionados — el navegador ve dos URLs
# distintas para el mismo archivo. Es además una buena práctica de seguridad:
# un id de sesión en la URL puede terminar filtrado en logs o en el header
# Referer de un enlace saliente.
server.servlet.session.tracking-modes=cookie

# Puerto del servidor
server.port=8080

# Nombre de la aplicación
spring.application.name=clinica_Despertares

# Compresión HTTP: reduce el tamaño de HTML/CSS/JS que viaja en cada
# navegación (styles.css baja de ~29 KB a pocos KB comprimido).
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# CSS/JS/imágenes se sirven con un hash de su contenido en la URL
# (p. ej. /css/styles-3f2a1b.css) y cache de un año marcada "immutable" en la
# práctica: el navegador los usa directamente de su caché en cada navegación
# en vez de mandar una petición condicional (If-Modified-Since) por cada uno
# como pasaba antes. Si el archivo cambia, el hash cambia solo y el navegador
# lo vuelve a pedir — no hace falta invalidar caché a mano.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
