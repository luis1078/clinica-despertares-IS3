# Base de datos
# Los valores por defecto son solo para desarrollo local; en cualquier otro entorno
# se deben definir las variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?stringtype=unspecified}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Puerto del servidor
server.port=8080

# Nombre de la aplicación
spring.application.name=clinica_Despertares
