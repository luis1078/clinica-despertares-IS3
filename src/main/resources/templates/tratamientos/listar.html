<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tratamientos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Gestión de Tratamientos</h1><div class="alert" th:if="${mensaje}" th:text="${mensaje}"></div><div class="actions"><a class="btn" th:href="@{/tratamientos/nuevo}">Nuevo tratamiento</a><a class="btn secondary" th:href="@{/detalle-tratamientos}">Detalle de tratamiento</a></div><table><thead><tr><th>ID</th><th>Tipo</th><th>Inicio</th><th>Fin</th><th>Estado</th><th>Historia</th><th>Descripción</th><th>Acciones</th></tr></thead><tbody><tr th:each="tratamiento : ${tratamientos}"><td th:text="${tratamiento.idTratamiento}"></td><td th:text="${tratamiento.tipoTratamiento}"></td><td th:text="${tratamiento.fechaInicio}"></td><td th:text="${tratamiento.fechaFin}"></td><td th:text="${tratamiento.estadoTratamiento}"></td><td th:text="${tratamiento.historiaMedica != null ? tratamiento.historiaMedica.codHistoriaMedica : '-'}"></td><td th:text="${tratamiento.descripcionTratamiento}"></td><td><a class="btn small warning" th:href="@{/tratamientos/editar/{id}(id=${tratamiento.idTratamiento})}">Editar</a> <a class="btn small success" th:href="@{/tratamientos/finalizar/{id}(id=${tratamiento.idTratamiento})}">Finalizar</a> <a class="btn small secondary" th:href="@{/tratamientos/suspender/{id}(id=${tratamiento.idTratamiento})}">Suspender</a> <a class="btn small danger" th:href="@{/tratamientos/eliminar/{id}(id=${tratamiento.idTratamiento})}" onclick="return confirm('¿Eliminar tratamiento?')">Eliminar</a></td></tr></tbody></table>
    </section>

</main>

</body>
</html>
