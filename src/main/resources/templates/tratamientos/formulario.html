<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Tratamiento</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Formulario de Tratamiento</h1><form th:action="@{/tratamientos/guardar}" th:object="${tratamiento}" method="post" class="form-grid"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" th:field="*{idTratamiento}"><div class="form-group"><label>Historia médica</label><select name="codHistoriaMedica" required><option value="">Seleccione</option><option th:each="historia : ${historias}" th:value="${historia.codHistoriaMedica}" th:text="${historia.paciente != null ? historia.paciente.nombrePaciente + ' ' + historia.paciente.apellidoPaciente + ' - ' + historia.paciente.dnipaciente : 'Sin paciente'}" th:selected="${tratamiento.historiaMedica != null and tratamiento.historiaMedica.codHistoriaMedica == historia.codHistoriaMedica}"></option></select></div><div class="form-group"><label>Tipo tratamiento</label><input type="text" th:field="*{tipoTratamiento}" required></div><div class="form-group"><label>Fecha inicio</label><input type="date" th:field="*{fechaInicio}" required></div><div class="form-group"><label>Fecha fin</label><input type="date" th:field="*{fechaFin}" required></div><div class="form-group"><label>Estado</label><select th:field="*{estadoTratamiento}" required><option value="">Seleccione</option><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option></select></div><div class="form-group full"><label>Descripción</label><textarea th:field="*{descripcionTratamiento}" required></textarea></div><div class="form-group full"><button class="btn success" type="submit">Guardar</button><a class="btn secondary" th:href="@{/tratamientos}">Cancelar</a></div></form>
    </section>

</main>

</body>
</html>
