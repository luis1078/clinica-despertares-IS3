<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Comprobantes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Detalle de Comprobantes</h1><div class="alert" th:if="${mensaje}" th:text="${mensaje}"></div><div class="actions"><a class="btn" th:href="@{/detalle-comprobantes/nuevo}">Nuevo detalle</a></div><table><thead><tr><th>ID</th><th>Comprobante</th><th>Tipo ítem</th><th>ID referencia</th><th>Descripción</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th><th>Acciones</th></tr></thead><tbody><tr th:each="detalle : ${detalles}"><td th:text="${detalle.iddetalle}"></td><td th:text="${detalle.comprobantePago != null ? detalle.comprobantePago.codcomprobante : '-'}"></td><td th:text="${detalle.tipoItem}"></td><td th:text="${detalle.idReferencia}"></td><td th:text="${detalle.descripcionDetalle}"></td><td th:text="${detalle.cantidad}"></td><td th:text="${detalle.precioUnitario}"></td><td th:text="${detalle.subtotal}"></td><td><a class="btn small warning" th:href="@{/detalle-comprobantes/editar/{id}(id=${detalle.iddetalle})}">Editar</a> <a class="btn small danger" th:href="@{/detalle-comprobantes/eliminar/{id}(id=${detalle.iddetalle})}" onclick="return confirm('¿Eliminar detalle?')">Eliminar</a></td></tr></tbody></table>
    </section>

</main>

</body>
</html>
