<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><script>try{var t=localStorage.getItem('tema');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
    <title>Formulario Detalle Comprobante</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content">
        <div class="page-header">
            <div>
                <h1>Formulario de Detalle de Comprobante</h1>
                <p>Seleccione el tipo de ítem y su referencia real. El total del comprobante se recalcula con los subtotales.</p>
            </div>
        </div>

        <form th:action="@{/detalle-comprobantes/guardar}" method="post" th:object="${detalle}" class="form-card"><input type="hidden" name="_csrf" th:value="${csrfToken}">

            <input type="hidden" th:field="*{iddetalle}">

            <div class="field">
                <label>Comprobante</label>
                <select name="codComprobante" required>
                    <option value="">Seleccione</option>
                    <option th:each="comprobante : ${comprobantes}"
                            th:value="${comprobante.codcomprobante}"
                            th:text="${'Comprobante N° ' + comprobante.codcomprobante + ' - Total: ' + comprobante.montoTotal}"
                            th:selected="${(detalle.comprobantePago != null and detalle.comprobantePago.codcomprobante == comprobante.codcomprobante) or (comprobanteSeleccionado != null and comprobanteSeleccionado == comprobante.codcomprobante)}">
                    </option>
                </select>
            </div>

            <div class="field">
                <label>Tipo ítem</label>
                <select name="tipoItem" required>
                    <option value="">Seleccione</option>
                    <option th:each="tipo : ${tiposItem}"
                            th:value="${tipo}"
                            th:text="${tipo}"
                            th:selected="${detalle.tipoItem == tipo}">
                    </option>
                </select>
            </div>

            <div class="field">
                <label>Cita médica</label>
                <select name="codCitaMedica">
                    <option value="">Seleccione si el tipo es CITA</option>
                    <option th:each="cita : ${citas}"
                            th:value="${cita.codCitaMedica}"
                            th:text="${'Cita ' + cita.codCitaMedica + ' - ' + (cita.paciente != null ? cita.paciente.nombrePaciente + ' ' + cita.paciente.apellidoPaciente : 'Sin paciente') + ' - ' + cita.fechaCita}"
                            th:selected="${detalle.tipoItem != null and detalle.tipoItem.name() == 'CITA' and detalle.idReferencia == cita.codCitaMedica}">
                    </option>
                </select>
            </div>

            <div class="field">
                <label>Examen médico</label>
                <select name="codExamenMedico">
                    <option value="">Seleccione si el tipo es EXAMEN</option>
                    <option th:each="examen : ${examenes}"
                            th:value="${examen.codExamenMedico}"
                            th:text="${'Examen ' + examen.codExamenMedico + ' - ' + (examen.diagnostico != null and examen.diagnostico.historiaMedica != null and examen.diagnostico.historiaMedica.paciente != null ? examen.diagnostico.historiaMedica.paciente.nombrePaciente + ' ' + examen.diagnostico.historiaMedica.paciente.apellidoPaciente : 'Sin paciente')}"
                            th:selected="${detalle.tipoItem != null and detalle.tipoItem.name() == 'EXAMEN' and detalle.idReferencia == examen.codExamenMedico}">
                    </option>
                </select>
            </div>

            <div class="field">
                <label>Medicamento</label>
                <select name="codMedicamento">
                    <option value="">Seleccione si el tipo es MEDICAMENTO</option>
                    <option th:each="medicamento : ${medicamentos}"
                            th:value="${medicamento.codMedicamento}"
                            th:text="${medicamento.codMedicamento + ' - ' + medicamento.nombreMedicamento + ' - Stock: ' + medicamento.stockInventario}"
                            th:selected="${detalle.tipoItem != null and detalle.tipoItem.name() == 'MEDICAMENTO' and detalle.idReferencia == medicamento.codMedicamento}">
                    </option>
                </select>
            </div>

            <div class="field">
                <label>Cantidad</label>
                <input type="number" th:field="*{cantidad}" min="1" required>
            </div>

            <div class="field">
                <label>Precio unitario</label>
                <input type="number" th:field="*{precioUnitario}" step="0.01" min="0" required>
            </div>

            <div class="field">
                <label>Descripción</label>
                <textarea th:field="*{descripcionDetalle}" rows="4" required></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/detalle-comprobantes}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </main>
</div>

</body>
</html>
