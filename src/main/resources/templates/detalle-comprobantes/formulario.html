<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Detalle Comprobante</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Formulario de Detalle de Comprobante</h1><form th:action="@{/detalle-comprobantes/guardar}" th:object="${detalle}" method="post" class="form-grid"><input type="hidden" th:field="*{iddetalle}"><div class="form-group"><label>Comprobante</label><select name="codComprobante" required><option value="">Seleccione</option><option th:each="comprobante : ${comprobantes}" th:value="${comprobante.codcomprobante}" th:text="${'Comprobante ' + comprobante.codcomprobante + ' - Total: ' + comprobante.montoTotal}" th:selected="${detalle.comprobantePago != null and detalle.comprobantePago.codcomprobante == comprobante.codcomprobante}"></option></select></div><div class="form-group"><label>Tipo ítem</label><select name="tipoItem" required><option value="">Seleccione</option><option th:each="tipo : ${tiposItem}" th:value="${tipo}" th:text="${tipo}" th:selected="${detalle.tipoItem == tipo}"></option></select></div><div class="form-group"><label>ID referencia</label><input type="number" name="idReferencia" th:value="${detalle.idReferencia}" required></div><div class="form-group"><label>Cantidad</label><input type="number" th:field="*{cantidad}" min="1" required></div><div class="form-group"><label>Precio unitario</label><input type="number" step="0.01" th:field="*{precioUnitario}" required></div><div class="form-group"><label>Subtotal</label><input type="number" step="0.01" th:field="*{subtotal}" required></div><div class="form-group full"><label>Descripción</label><textarea th:field="*{descripcionDetalle}" required></textarea></div><div class="form-group full"><button class="btn success" type="submit">Guardar</button><a class="btn secondary" th:href="@{/detalle-comprobantes}">Cancelar</a></div></form>
    </section>

</main>

</body>
</html>
