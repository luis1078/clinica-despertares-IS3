<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Pacientes</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body>
<div class="dashboard-shell">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="dashboard-body">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="content-card">
            <div class="actions"><h1>Gestión de Pacientes</h1><a th:if="${session.rolUsuario == 'ENFERMERA' or session.rolUsuario == 'MEDICO'}" th:href="@{/pacientes/nuevo}" class="btn">Nuevo paciente</a></div>
            <div th:if="${mensaje}" class="alert success" th:text="${mensaje}"></div>
            <div th:if="${error}" class="alert error" th:text="${error}"></div>
            <form th:action="@{/pacientes}" method="get" class="inline-form actions">
                <input type="text" name="buscar" th:value="${buscar}" placeholder="Buscar por DNI, nombre, apellido, correo o teléfono">
                <button type="submit" class="btn">Buscar</button><a th:href="@{/pacientes}" class="btn secondary">Limpiar</a>
            </form>
            <table>
                <thead><tr><th>DNI</th><th>Paciente</th><th>Teléfono</th><th>Correo</th><th>Género</th><th>Tipo sangre</th><th th:if="${session.rolUsuario != 'CAJERO'}">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="paciente : ${pacientes}">
                    <td th:text="${paciente.dnipaciente}">12345678</td>
                    <td th:text="${paciente.nombrePaciente + ' ' + paciente.apellidoPaciente}">Paciente</td>
                    <td th:text="${paciente.telefono}">999999999</td>
                    <td th:text="${paciente.correoElectronico}">correo</td>
                    <td th:text="${paciente.genero}">Género</td>
                    <td th:text="${paciente.tipoSangre}">O+</td>
                    <td th:if="${session.rolUsuario != 'CAJERO'}">
                        <a th:href="@{/pacientes/editar/{dni}(dni=${paciente.dnipaciente})}" class="btn small">Editar</a>
                        <a th:href="@{/historias/nuevo(dniPaciente=${paciente.dnipaciente})}" class="btn small success" th:if="${paciente.historiaMedica == null and (session.rolUsuario == 'ENFERMERA' or session.rolUsuario == 'MEDICO')}">Crear historia</a>
                        <a th:href="@{/historias}" class="btn small secondary" th:if="${paciente.historiaMedica != null}">Ver historia</a>
                        <form th:action="@{/pacientes/eliminar/{dni}(dni=${paciente.dnipaciente})}" method="post" class="inline-action" onsubmit="return confirm('¿Deseas eliminar este paciente?');"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                            <button type="submit" class="btn small danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pacientes)}"><td th:attr="colspan=${session.rolUsuario == 'CAJERO' ? 6 : 7}" class="empty-row">No se encontraron pacientes.</td></tr>
                </tbody>
            </table>
        </main>
    </div>
</div>
</body>
</html>
