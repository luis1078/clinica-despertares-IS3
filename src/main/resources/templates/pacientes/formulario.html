<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Paciente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Formulario de Paciente</h1>
    <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post" class="form-grid">
        <div class="form-group"><label>DNI</label><input type="text" th:field="*{dnipaciente}" maxlength="8" required></div>
        <div class="form-group"><label>Nombre</label><input type="text" th:field="*{nombrePaciente}" required></div>
        <div class="form-group"><label>Apellido</label><input type="text" th:field="*{apellidoPaciente}" required></div>
        <div class="form-group"><label>Teléfono</label><input type="text" th:field="*{telefono}" maxlength="9" required></div>
        <div class="form-group"><label>Correo electrónico</label><input type="email" th:field="*{correoElectronico}" required></div>
        <div class="form-group"><label>Fecha de nacimiento</label><input type="date" th:field="*{fechaNacimiento}" required></div>
        <div class="form-group"><label>Género</label><select th:field="*{genero}" required><option value="">Seleccione</option><option th:each="genero : ${generos}" th:value="${genero}" th:text="${genero}"></option></select></div>
        <div class="form-group"><label>Tipo de sangre</label><input type="text" th:field="*{tipoSangre}" required></div>
        <div class="form-group full"><label>Dirección</label><input type="text" th:field="*{direccion}"></div>
        <div class="form-group full"><label>Alergias</label><textarea th:field="*{alergias}"></textarea></div>
        <div class="form-group full"><button class="btn success" type="submit">Guardar</button><a class="btn secondary" th:href="@{/pacientes}">Cancelar</a></div>
    </form>
    </section>

</main>

</body>
</html>
