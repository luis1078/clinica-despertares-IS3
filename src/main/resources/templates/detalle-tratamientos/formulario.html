<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Detalle Tratamiento</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Formulario de Detalle de Tratamiento</h1><form th:action="@{/detalle-tratamientos/guardar}" th:object="${detalle}" method="post" class="form-grid"><input type="hidden" th:field="*{idDetalleTratamiento}"><div class="form-group"><label>Tratamiento</label><select name="idTratamiento" required><option value="">Seleccione</option><option th:each="tratamiento : ${tratamientos}" th:value="${tratamiento.idTratamiento}" th:text="${'Tratamiento ' + tratamiento.idTratamiento + ' - ' + tratamiento.tipoTratamiento}" th:selected="${detalle.tratamiento != null and detalle.tratamiento.idTratamiento == tratamiento.idTratamiento}"></option></select></div><div class="form-group"><label>Medicamento</label><select name="codMedicamento" required><option value="">Seleccione</option><option th:each="medicamento : ${medicamentos}" th:value="${medicamento.codMedicamento}" th:text="${medicamento.nombreMedicamento + ' - Stock: ' + medicamento.stockInventario}" th:selected="${detalle.medicamento != null and detalle.medicamento.codMedicamento == medicamento.codMedicamento}"></option></select></div><div class="form-group"><label>Dosis indicada</label><input type="text" th:field="*{dosisIndicada}" required></div><div class="form-group"><label>Frecuencia de toma</label><input type="text" th:field="*{frecuenciaDeToma}" required></div><div class="form-group full"><label>Observaciones</label><textarea th:field="*{observaciones}"></textarea></div><div class="form-group full"><button class="btn success" type="submit">Guardar</button><a class="btn secondary" th:href="@{/detalle-tratamientos}">Cancelar</a></div></form>
    </section>

</main>

</body>
</html>
