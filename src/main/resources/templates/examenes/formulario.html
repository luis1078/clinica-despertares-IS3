<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><script>try{var t=localStorage.getItem('tema');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
    <title>Formulario Examen Médico</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
<script th:src="@{/js/vendor/turbo.es2017-umd.min.js}"></script></head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Formulario de Solicitud de Examen Médico</h1><form th:action="@{/examenes/guardar}" th:object="${examen}" method="post" class="form-grid"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" th:field="*{codExamenMedico}"><div class="form-group"><label>Diagnóstico</label><select name="idDiagnostico" required><option value="">Seleccione</option><option th:each="diagnostico : ${diagnosticos}" th:value="${diagnostico.idDiagnostico}" th:text="${'Diagnóstico ' + diagnostico.idDiagnostico + ' - ' + (diagnostico.historiaMedica != null and diagnostico.historiaMedica.paciente != null ? diagnostico.historiaMedica.paciente.nombrePaciente + ' ' + diagnostico.historiaMedica.paciente.apellidoPaciente : 'Sin paciente')}" th:selected="${examen.diagnostico != null and examen.diagnostico.idDiagnostico == diagnostico.idDiagnostico}"></option></select></div><div class="form-group"><label>Tipo examen</label><select th:field="*{tipoExamen}" required><option value="">Seleccione</option><option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}"></option></select></div><div class="form-group"><label>Fecha examen</label><input type="date" th:field="*{fechaExamen}" required></div><div class="form-group"><label>Fecha resultado</label><input type="date" th:field="*{fechaResultado}"></div><div class="form-group"><label>Estado</label><select th:field="*{estadoExamenMedico}" required><option value="">Seleccione</option><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option></select></div><div class="form-group full"><label>Observaciones</label><textarea th:field="*{observaciones}"></textarea></div><div class="form-group full"><button class="btn success" type="submit">Guardar</button><a class="btn secondary" th:href="@{/examenes}">Cancelar</a></div></form>
    </section>

</main>

</body>
</html>
