<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><script>try{var t=localStorage.getItem('tema');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
    <title>Exámenes Médicos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
<script th:src="@{/js/vendor/turbo.es2017-umd.min.js}"></script></head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Solicitudes de Exámenes Médicos</h1><div class="alert" th:if="${mensaje}" th:text="${mensaje}"></div><div class="actions"><a class="btn" th:href="@{/examenes/nuevo}">Nueva solicitud</a><a class="btn secondary" th:href="@{/laboratorio}">Laboratorio</a><a class="btn secondary" th:href="@{/imagenes}">Imágenes</a></div><table><thead><tr><th>Código</th><th>Tipo</th><th>Fecha examen</th><th>Fecha resultado</th><th>Estado</th><th>Diagnóstico</th><th>Observaciones</th><th>Acciones</th></tr></thead><tbody><tr th:each="examen : ${examenes}"><td th:text="${examen.codExamenMedico}"></td><td th:text="${examen.tipoExamen}"></td><td th:text="${examen.fechaExamen}"></td><td th:text="${examen.fechaResultado}"></td><td th:text="${examen.estadoExamenMedico}"></td><td th:text="${examen.diagnostico != null ? examen.diagnostico.idDiagnostico : '-'}"></td><td th:text="${examen.observaciones}"></td><td><a class="btn small warning" th:href="@{/examenes/editar/{id}(id=${examen.codExamenMedico})}">Editar</a> <form th:action="@{/examenes/proceso/{id}(id=${examen.codExamenMedico})}" method="post" class="inline-action"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button type="submit" class="btn small secondary">En proceso</button></form> <form th:action="@{/examenes/finalizar/{id}(id=${examen.codExamenMedico})}" method="post" class="inline-action"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button type="submit" class="btn small success">Finalizar</button></form> <form th:action="@{/examenes/eliminar/{id}(id=${examen.codExamenMedico})}" method="post" class="inline-action" onsubmit="return confirm('¿Eliminar examen?');"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button type="submit" class="btn small danger">Eliminar</button></form></td></tr></tbody></table>
        <div th:replace="~{fragments/paginacion :: paginacion('/examenes', ${pagina})}"></div>
    </section>

</main>

</body>
</html>
