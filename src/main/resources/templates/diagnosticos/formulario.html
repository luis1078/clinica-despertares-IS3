<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Diagnóstico</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Formulario de Diagnóstico</h1><form th:action="@{/diagnosticos/guardar}" th:object="${diagnostico}" method="post" class="form-grid"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" th:field="*{idDiagnostico}"><div class="form-group"><label>Historia médica</label><select name="codHistoriaMedica" required><option value="">Seleccione</option><option th:each="historia : ${historias}" th:value="${historia.codHistoriaMedica}" th:text="${historia.paciente != null ? historia.paciente.nombrePaciente + ' ' + historia.paciente.apellidoPaciente + ' - ' + historia.paciente.dnipaciente : 'Sin paciente'}" th:selected="${diagnostico.historiaMedica != null and diagnostico.historiaMedica.codHistoriaMedica == historia.codHistoriaMedica}"></option></select></div><div class="form-group"><label>Fecha diagnóstico</label><input type="date" th:field="*{fechaDiagnostico}" required></div><div class="form-group"><label>Gravedad</label><select th:field="*{gravedadDiagnostico}" required><option value="">Seleccione</option><option th:each="gravedad : ${gravedades}" th:value="${gravedad}" th:text="${gravedad}"></option></select></div><div class="form-group full"><label>Descripción</label><textarea th:field="*{descripcionDiagnostico}" required></textarea></div><div class="form-group full"><button class="btn success" type="submit">Guardar</button><a class="btn secondary" th:href="@{/diagnosticos}">Cancelar</a></div></form>
    </section>

</main>

</body>
</html>
