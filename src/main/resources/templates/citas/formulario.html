<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Cita</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Formulario de Cita Médica</h1><form th:action="@{/citas/guardar}" th:object="${cita}" method="post" class="form-grid"><input type="hidden" th:field="*{codCitaMedica}"><div class="form-group"><label>Paciente</label><select name="dniPaciente" required><option value="">Seleccione</option><option th:each="paciente : ${pacientes}" th:value="${paciente.dnipaciente}" th:text="${paciente.dnipaciente + ' - ' + paciente.nombrePaciente + ' ' + paciente.apellidoPaciente}" th:selected="${cita.paciente != null and cita.paciente.dnipaciente == paciente.dnipaciente}"></option></select></div><div class="form-group"><label>Médico</label><select name="idMedico" required><option value="">Seleccione</option><option th:each="medico : ${medicos}" th:value="${medico.idMedico}" th:text="${medico.nombreMedico + ' ' + medico.apellidoMedico + ' - ' + medico.especialidad}" th:selected="${cita.medico != null and cita.medico.idMedico == medico.idMedico}"></option></select></div><div class="form-group"><label>Fecha de cita</label><input type="date" th:field="*{fechaCita}" required></div><div class="form-group"><label>Hora de cita</label><input type="time" th:field="*{horaCita}" required></div><div class="form-group"><label>Estado</label><select th:field="*{estadoCita}"><option value="">Seleccione</option><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option></select></div><div class="form-group full"><label>Motivo de consulta</label><textarea th:field="*{motivoConsulta}" required></textarea></div><div class="form-group full"><button class="btn success" type="submit">Guardar</button><a class="btn secondary" th:href="@{/citas}">Cancelar</a></div></form>
    </section>

</main>

</body>
</html>
