<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><script>try{var t=localStorage.getItem('tema');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script><title>Cita Médica</title><link rel="stylesheet" th:href="@{/css/styles.css}"><script th:src="@{/js/vendor/turbo.es2017-umd.min.js}"></script></head>
<body>
<div class="dashboard-shell">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="dashboard-body">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="content-card">
            <h1>Formulario de Cita Médica</h1>
            <div class="alert success">Al presionar <strong>Guardar</strong>, si la cita es nueva, el sistema generará automáticamente un comprobante de pago.</div>
            <div th:if="${error}" class="alert error" th:text="${error}"></div>
            <form th:action="@{/citas/guardar}" th:object="${cita}" method="post" class="form-grid"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                <input type="hidden" th:field="*{codCitaMedica}">
                <div class="form-group"><label>Paciente</label><select name="dniPaciente" required><option value="">Seleccione</option><option th:each="paciente : ${pacientes}" th:value="${paciente.dnipaciente}" th:text="${paciente.dnipaciente + ' - ' + paciente.nombrePaciente + ' ' + paciente.apellidoPaciente}" th:selected="${cita.paciente != null and cita.paciente.dnipaciente == paciente.dnipaciente}"></option></select></div>
                <div class="form-group"><label>Médico</label><select name="idMedico" required><option value="">Seleccione</option><option th:each="medico : ${medicos}" th:value="${medico.idMedico}" th:text="${medico.nombreMedico + ' ' + medico.apellidoMedico + ' - ' + medico.especialidad}" th:selected="${cita.medico != null and cita.medico.idMedico == medico.idMedico}"></option></select></div>
                <div class="form-group"><label>Fecha de cita</label><input type="date" th:field="*{fechaCita}" required></div>
                <div class="form-group"><label>Hora de cita</label><input type="time" th:field="*{horaCita}" required></div>
                <div class="form-group"><label>Estado</label><select th:field="*{estadoCita}" required><option value="">Seleccione</option><option th:each="estado : ${estados}" th:value="${estado.name()}" th:text="${estado.etiqueta}"></option></select></div>
                <div class="form-group full"><label>Motivo de consulta</label><textarea th:field="*{motivoConsulta}" required placeholder="Ingrese el motivo de consulta"></textarea></div>
                <div class="form-group full actions"><button type="submit" class="btn">Guardar</button><a th:href="@{/citas}" class="btn secondary">Cancelar</a></div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
