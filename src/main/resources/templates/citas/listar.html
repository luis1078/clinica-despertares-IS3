<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><script>try{var t=localStorage.getItem('tema');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
    <title>Citas Médicas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
<script th:src="@{/js/vendor/turbo.es2017-umd.min.js}"></script></head>
<body>

<div class="dashboard-shell">

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="dashboard-body">

        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main class="content-card">

            <div class="actions">
                <h1>Gestión de Citas Médicas</h1>

                <a th:if="${session.rolUsuario == 'MEDICO' or session.rolUsuario == 'ENFERMERA'}"
                   th:href="@{/citas/nuevo}"
                   class="btn">
                    Nueva cita
                </a>
            </div>

            <div th:if="${mensaje}" class="alert success" th:text="${mensaje}"></div>
            <div th:if="${error}" class="alert error" th:text="${error}"></div>

            <form th:action="@{/citas}" method="get" class="inline-form actions">
                <input type="text" name="buscar" th:value="${buscar}" placeholder="Buscar por paciente, DNI, médico, fecha, estado o motivo">
                <select name="estado">
                    <option value="">Todos los estados</option>
                    <option th:each="estado : ${estados}" th:value="${estado.name()}" th:text="${estado.etiqueta}" th:selected="${estado == estadoSeleccionado}"></option>
                </select>
                <button type="submit" class="btn">Buscar</button>
                <a th:href="@{/citas}" class="btn secondary">Limpiar</a>
            </form>

            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Paciente</th>
                    <th>Médico</th>
                    <th>Estado</th>
                    <th>Motivo</th>
                    <th th:if="${session.rolUsuario != 'CAJERO'}">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="cita : ${citas}">
                    <td th:text="${cita.codCitaMedica}">1</td>
                    <td th:text="${cita.fechaCita}">2026-01-01</td>
                    <td th:text="${cita.horaCita}">08:00</td>
                    <td th:text="${cita.paciente != null ? cita.paciente.nombrePaciente + ' ' + cita.paciente.apellidoPaciente : 'Sin paciente'}">Paciente</td>
                    <td th:text="${cita.medico != null ? cita.medico.nombreMedico + ' ' + cita.medico.apellidoMedico : 'Sin médico'}">Médico</td>
                    <td th:text="${cita.estadoCita != null ? cita.estadoCita.etiqueta : '-'}">Pendiente</td>
                    <td th:text="${cita.motivoConsulta}">Motivo</td>

                    <td th:if="${session.rolUsuario != 'CAJERO'}">
                        <a th:if="${session.rolUsuario == 'MEDICO' or session.rolUsuario == 'ENFERMERA'}"
                           th:href="@{/citas/editar/{id}(id=${cita.codCitaMedica})}"
                           class="btn small">
                            Editar
                        </a>

                        <form th:if="${session.rolUsuario == 'MEDICO' or session.rolUsuario == 'ENFERMERA'}"
                              th:action="@{/citas/cancelar/{id}(id=${cita.codCitaMedica})}"
                              method="post"
                              class="inline-action"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                            <button type="submit" class="btn small warning">Cancelar</button>
                        </form>

                        <form th:if="${session.rolUsuario == 'MEDICO'}"
                              th:action="@{/citas/finalizar/{id}(id=${cita.codCitaMedica})}"
                              method="post"
                              class="inline-action"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                            <button type="submit" class="btn small success">Finalizar</button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(citas)}">
                    <td th:attr="colspan=${session.rolUsuario == 'CAJERO' ? 7 : 8}" class="empty-row">No se encontraron citas médicas.</td>
                </tr>
                </tbody>
            </table>

            <div th:replace="~{fragments/paginacion :: paginacion('/citas', ${pagina})}"></div>

        </main>

    </div>
</div>

</body>
</html>
