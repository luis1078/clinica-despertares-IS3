<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Citas Médicas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Gestión de Citas Médicas</h1><div class="alert" th:if="${mensaje}" th:text="${mensaje}"></div><div class="actions"><a class="btn" th:href="@{/citas/nuevo}">Nueva cita</a><form th:action="@{/citas}" method="get" class="inline-form"><select name="estado"><option value="">Todos</option><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}" th:selected="${estado == estadoSeleccionado}"></option></select><button class="btn secondary" type="submit">Filtrar</button></form></div><table><thead><tr><th>Código</th><th>Fecha</th><th>Hora</th><th>Paciente</th><th>Médico</th><th>Estado</th><th>Motivo</th><th>Reprogramar</th><th>Acciones</th></tr></thead><tbody><tr th:each="cita : ${citas}"><td th:text="${cita.codCitaMedica}"></td><td th:text="${cita.fechaCita}"></td><td th:text="${cita.horaCita}"></td><td th:text="${cita.paciente != null ? cita.paciente.nombrePaciente + ' ' + cita.paciente.apellidoPaciente : '-'}"></td><td th:text="${cita.medico != null ? cita.medico.nombreMedico + ' ' + cita.medico.apellidoMedico : '-'}"></td><td th:text="${cita.estadoCita}"></td><td th:text="${cita.motivoConsulta}"></td><td><form th:action="@{/citas/reprogramar/{id}(id=${cita.codCitaMedica})}" method="post" class="inline-form"><input type="date" name="nuevaFecha" required><input type="time" name="nuevaHora" required><button class="btn small secondary" type="submit">Reprogramar</button></form></td><td><a class="btn small warning" th:href="@{/citas/editar/{id}(id=${cita.codCitaMedica})}">Editar</a> <a class="btn small success" th:href="@{/citas/finalizar/{id}(id=${cita.codCitaMedica})}">Finalizar</a> <a class="btn small secondary" th:href="@{/citas/cancelar/{id}(id=${cita.codCitaMedica})}">Cancelar</a> <a class="btn small danger" th:href="@{/citas/eliminar/{id}(id=${cita.codCitaMedica})}" onclick="return confirm('¿Eliminar cita?')">Eliminar</a></td></tr></tbody></table>
    </section>

</main>

</body>
</html>
