<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><script>try{var t=localStorage.getItem('tema');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
    <title>Formulario Proveedor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
<script th:src="@{/js/vendor/turbo.es2017-umd.min.js}"></script></head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Formulario de Proveedor</h1><form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post" class="form-grid"><input type="hidden" name="_csrf" th:value="${csrfToken}"><div class="form-group"><label>RUC</label><input type="text" th:field="*{rucProveedor}" maxlength="11" required></div><div class="form-group"><label>Nombre proveedor</label><input type="text" th:field="*{nombreProveedor}" required></div><div class="form-group"><label>Correo</label><input type="email" th:field="*{correoProveedor}" required></div><div class="form-group"><label>Número contacto</label><input type="text" th:field="*{numeroContacto}" maxlength="9" required></div><div class="form-group full"><label>Dirección</label><input type="text" th:field="*{direccion}" required></div><div class="form-group full"><button class="btn success" type="submit">Guardar</button><a class="btn secondary" th:href="@{/proveedores}">Cancelar</a></div></form>
    </section>

</main>

</body>
</html>
