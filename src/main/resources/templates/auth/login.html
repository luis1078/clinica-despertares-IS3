<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><script>try{var t=localStorage.getItem('tema');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
    <title>Iniciar sesión - Clínica Despertares</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
<script th:src="@{/js/vendor/turbo.es2017-umd.min.js}"></script></head>
<body>

<div class="login-page">
    <div class="login-card">

        <div class="login-logo">
            <div class="login-logo-icon" th:insert="~{fragments/icons :: cruz}"></div>
            <h1>Clínica Despertares</h1>
            <span>Sistema de gestión clínica</span>
        </div>

        <div th:if="${mensaje}" class="alert success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <form th:action="@{/login}" method="post" class="login-form"><input type="hidden" name="_csrf" th:value="${csrfToken}">

            <div class="form-group">
                <label for="username">Usuario o correo</label>
                <input id="username"
                       type="text"
                       name="username"
                       placeholder="Ingrese su usuario o correo"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password"
                       type="password"
                       name="password"
                       placeholder="Ingrese su contraseña"
                       required>
            </div>

            <button type="submit" class="btn-login-main">
                Iniciar sesión
            </button>

        </form>

        <div class="register-option">
            ¿No tienes una cuenta?
            <a th:href="@{/registro}">Registrarse</a>
        </div>

    </div>
</div>

</body>
</html>
