<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><script>try{var t=localStorage.getItem('tema');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
    <title>Registro - Clínica Despertares</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="login-page">
    <div class="login-card register-card">

        <div class="login-logo">
            <div class="login-logo-icon" th:insert="~{fragments/icons :: cruz}"></div>
            <h1>Crear cuenta</h1>
            <span>Clínica Despertares</span>
        </div>

        <div th:if="${error}" class="alert error" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert success" th:text="${mensaje}"></div>

        <form th:action="@{/registro}" th:object="${usuario}" method="post" class="login-form"><input type="hidden" name="_csrf" th:value="${csrfToken}">

            <div class="auth-form-grid">

                <div class="form-group">
                    <label for="correo">Correo</label>
                    <input id="correo"
                           type="email"
                           th:field="*{correo}"
                           placeholder="correo@clinica.com"
                           required>
                </div>

                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input id="username"
                           type="text"
                           th:field="*{username}"
                           placeholder="Nombre de usuario"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password"
                           type="password"
                           th:field="*{password}"
                           placeholder="Contraseña"
                           required>
                </div>

                <div class="form-group">
                    <label for="confirmarPassword">Confirmar contraseña</label>
                    <input id="confirmarPassword"
                           type="password"
                           name="confirmarPassword"
                           placeholder="Repita la contraseña"
                           required>
                </div>

                <div class="form-group">
                    <label for="rol">Rol</label>
                    <select id="rol" th:field="*{rol}" required>
                        <option value="">Seleccione un rol</option>
                        <option th:each="rol : ${roles}"
                                th:value="${rol}"
                                th:text="${rol}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="idMedico">Médico asociado</label>
                    <select id="idMedico" name="idMedico">
                        <option value="">No aplica</option>
                        <option th:each="medico : ${medicos}"
                                th:value="${medico.idMedico}"
                                th:text="${medico.nombreMedico + ' ' + medico.apellidoMedico}">
                        </option>
                    </select>
                </div>

            </div>

            <button type="submit" class="btn-login-main">
                Registrar cuenta
            </button>

        </form>

        <div class="register-option">
            ¿Ya tienes una cuenta?
            <a th:href="@{/login}">Iniciar sesión</a>
        </div>

    </div>
</div>

</body>
</html>
