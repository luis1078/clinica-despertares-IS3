<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clínica Despertares</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-body">

<main th:if="${session.usuarioLogueado == null}" class="login-page">

    <section class="login-card">

        <div class="login-logo">
            <div class="login-logo-icon">✚</div>
            <h1>Clínica Despertares</h1>
            <span>Sistema de gestión clínica</span>
        </div>

        <div th:if="${mensaje}" class="alert success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <form th:action="@{/login}" method="post" class="login-form">

            <div class="form-group">
                <label>Usuario o correo</label>
                <input type="text" name="username" placeholder="Ingrese su usuario o correo" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="Ingrese su contraseña" required>
            </div>

            <button type="submit" class="btn-login-main">
                Iniciar sesión
            </button>

        </form>

        <div class="register-option">
            <span>¿No tienes una cuenta?</span>
            <a th:href="@{/registro}">Registrarse</a>
        </div>

    </section>

</main>

<div th:if="${session.usuarioLogueado != null}" class="dashboard-shell">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="dashboard-body">

        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <section class="workspace-panel">
        </section>

    </main>

</div>

</body>
</html>
