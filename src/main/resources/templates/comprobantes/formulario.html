<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Comprobante</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Formulario de Comprobante</h1><form th:action="@{/comprobantes/guardar}" th:object="${comprobante}" method="post" class="form-grid"><input type="hidden" th:field="*{codcomprobante}"><div class="form-group"><label>Paciente</label><select name="dniPaciente" required><option value="">Seleccione</option><option th:each="paciente : ${pacientes}" th:value="${paciente.dnipaciente}" th:text="${paciente.dnipaciente + ' - ' + paciente.nombrePaciente + ' ' + paciente.apellidoPaciente}" th:selected="${comprobante.paciente != null and comprobante.paciente.dnipaciente == paciente.dnipaciente}"></option></select></div><div class="form-group"><label>Fecha emisión</label><input type="date" th:field="*{fechaEmision}" required></div><div class="form-group"><label>Tipo comprobante</label><select th:field="*{tipoComprobante}" required><option value="">Seleccione</option><option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}"></option></select></div><div class="form-group"><label>Método de pago</label><select th:field="*{metodoPago}" required><option value="">Seleccione</option><option th:each="metodo : ${metodos}" th:value="${metodo}" th:text="${metodo}"></option></select></div><div class="form-group"><label>Estado</label><select th:field="*{estado}" required><option value="">Seleccione</option><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option></select></div><div class="form-group"><label>Subtotal</label><input type="number" step="0.01" th:field="*{subtotal}" required></div><div class="form-group"><label>Monto total</label><input type="number" step="0.01" th:field="*{montoTotal}" required></div><div class="form-group full"><button class="btn success" type="submit">Guardar</button><a class="btn secondary" th:href="@{/comprobantes}">Cancelar</a></div></form>
    </section>

</main>

</body>
</html>
