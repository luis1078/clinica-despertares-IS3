<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><script>try{var t=localStorage.getItem('tema');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
    <title>Historias Médicas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="dashboard-shell">

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="dashboard-body">

        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main class="content-card">

            <div class="actions">
                <h1>Historias Médicas</h1>

                <a th:if="${session.rolUsuario == 'MEDICO' or session.rolUsuario == 'ENFERMERA'}"
                   th:href="@{/historias/nuevo}"
                   class="btn">
                    Nueva historia
                </a>
            </div>

            <div th:if="${mensaje}" class="alert success" th:text="${mensaje}"></div>
            <div th:if="${error}" class="alert error" th:text="${error}"></div>

            <form th:action="@{/historias}" method="get" class="inline-form">
                <input type="text" name="q" th:value="${busqueda}" placeholder="Buscar por paciente o DNI">
                <button type="submit" class="btn secondary">Buscar</button>
                <a th:href="@{/historias}" class="btn secondary">Limpiar</a>
            </form>

            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Fecha</th>
                    <th>Paciente</th>
                    <th>Antecedentes personales</th>
                    <th>Antecedentes familiares</th>
                    <th>Intervenciones</th>
                    <th th:if="${session.rolUsuario == 'MEDICO'}">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="historia : ${historias}">
                    <td th:text="${historia.codHistoriaMedica}">1</td>
                    <td th:text="${historia.fechaCreacion}">2026-01-01</td>
                    <td th:text="${historia.paciente != null ? historia.paciente.nombrePaciente + ' ' + historia.paciente.apellidoPaciente : 'Sin paciente'}">
                        Paciente
                    </td>
                    <td th:text="${historia.antecedentesPersonales}">Antecedentes</td>
                    <td th:text="${historia.antecedentesFamiliares}">Antecedentes</td>
                    <td th:text="${historia.intervencionesQuirurgicas}">Intervenciones</td>

                    <td th:if="${session.rolUsuario == 'MEDICO'}">
                        <a th:href="@{/historias/editar/{id}(id=${historia.codHistoriaMedica})}" class="btn small">
                            Editar
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(historias)}">
                    <td th:attr="colspan=${session.rolUsuario == 'MEDICO' ? 7 : 6}" class="empty-row">No se encontraron historias médicas.</td>
                </tr>
                </tbody>
            </table>

            <div th:replace="~{fragments/paginacion :: paginacion('/historias', ${pagina})}"></div>

        </main>

    </div>
</div>

</body>
</html>
