<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><script>try{var t=localStorage.getItem('tema');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script><title>Historia Médica</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body>
<div class="dashboard-shell">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="dashboard-body">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="content-card">
            <h1>Formulario de Historia Médica</h1>
            <form th:action="@{/historias/guardar}" th:object="${historia}" method="post" class="form-grid"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                <input type="hidden" th:field="*{codHistoriaMedica}">
                <div class="form-group"><label>Paciente</label><select name="dniPaciente" required><option value="">Seleccione</option><option th:each="paciente : ${pacientes}" th:value="${paciente.dnipaciente}" th:text="${paciente.dnipaciente + ' - ' + paciente.nombrePaciente + ' ' + paciente.apellidoPaciente}" th:selected="${pacienteSeleccionado != null and paciente.dnipaciente == pacienteSeleccionado}"></option></select></div>
                <div class="form-group"><label>Fecha de creación</label><input type="date" th:field="*{fechaCreacion}" required></div>
                <div class="form-group full"><label>Antecedentes personales</label><textarea th:field="*{antecedentesPersonales}" placeholder="Ingrese antecedentes personales"></textarea></div>
                <div class="form-group full"><label>Antecedentes familiares</label><textarea th:field="*{antecedentesFamiliares}" placeholder="Ingrese antecedentes familiares"></textarea></div>
                <div class="form-group full"><label>Intervenciones quirúrgicas</label><textarea th:field="*{intervencionesQuirurgicas}" placeholder="Ingrese intervenciones quirúrgicas"></textarea></div>
                <div class="form-group full actions"><button type="submit" class="btn">Guardar</button><a th:href="@{/pacientes}" class="btn secondary">Cancelar</a></div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
