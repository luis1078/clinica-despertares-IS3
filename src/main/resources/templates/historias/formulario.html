<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Historia Médica</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Formulario de Historia Médica</h1><form th:action="@{/historias/guardar}" th:object="${historia}" method="post" class="form-grid"><input type="hidden" th:field="*{codHistoriaMedica}"><div class="form-group"><label>Paciente</label><select name="dniPaciente"><option value="">Seleccione</option><option th:each="paciente : ${pacientes}" th:value="${paciente.dnipaciente}" th:text="${paciente.dnipaciente + ' - ' + paciente.nombrePaciente + ' ' + paciente.apellidoPaciente}" th:selected="${historia.paciente != null and historia.paciente.dnipaciente == paciente.dnipaciente}"></option></select></div><div class="form-group"><label>Fecha de creación</label><input type="date" th:field="*{fechaCreacion}" required></div><div class="form-group full"><label>Antecedentes personales</label><textarea th:field="*{antecedentesPersonales}"></textarea></div><div class="form-group full"><label>Antecedentes familiares</label><textarea th:field="*{antecedentesFamiliares}"></textarea></div><div class="form-group full"><label>Intervenciones quirúrgicas</label><textarea th:field="*{intervencionesQuirurgicas}"></textarea></div><div class="form-group full"><button class="btn success" type="submit">Guardar</button><a class="btn secondary" th:href="@{/historias}">Cancelar</a></div></form>
    </section>

</main>

</body>
</html>
