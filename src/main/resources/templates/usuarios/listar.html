<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-body">

<div th:replace="~{fragments/header :: header}"></div>

<main class="dashboard-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <section class="content-card">
        <h1>Gestión de Usuarios</h1><div class="alert" th:if="${mensaje}" th:text="${mensaje}"></div><div class="actions"><a class="btn" th:href="@{/usuarios/nuevo}">Nuevo usuario</a></div><table><thead><tr><th>ID</th><th>Username</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Médico</th><th>Acciones</th></tr></thead><tbody><tr th:each="usuario : ${usuarios}"><td th:text="${usuario.idUsuario}"></td><td th:text="${usuario.username}"></td><td th:text="${usuario.correo}"></td><td th:text="${usuario.rol}"></td><td th:text="${usuario.estado ? 'Activo' : 'Inactivo'}"></td><td th:text="${usuario.medico != null ? usuario.medico.nombreMedico + ' ' + usuario.medico.apellidoMedico : '-'}"></td><td><a class="btn small warning" th:href="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}">Editar</a> <a class="btn small success" th:href="@{/usuarios/activar/{id}(id=${usuario.idUsuario})}">Activar</a> <a class="btn small secondary" th:href="@{/usuarios/desactivar/{id}(id=${usuario.idUsuario})}">Desactivar</a> <a class="btn small danger" th:href="@{/usuarios/eliminar/{id}(id=${usuario.idUsuario})}" onclick="return confirm('¿Eliminar usuario?')">Eliminar</a></td></tr></tbody></table>
    </section>

</main>

</body>
</html>
