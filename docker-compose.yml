services:
  db:
    image: postgres:16
    container_name: isw2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - isw2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isw2-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/postgres?stringtype=unspecified
      DB_USERNAME: postgres
      DB_PASSWORD: password
      THYMELEAF_CACHE: "true"
    ports:
      - "8080:8080"

volumes:
  isw2_postgres_data:
